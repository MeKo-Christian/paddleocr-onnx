name: Export PP-OCRv5 Models

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (leave empty for no release)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  export-models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install just
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
        just --version

    - name: Install dependencies
      run: just deps

    - name: Download PP-OCRv5 mobile detection model
      run: just download-mobile-det

    - name: Export PP-OCRv5 mobile detection model
      run: just export-mobile-det

    - name: Validate PP-OCRv5 mobile detection model
      run: just validate-mobile-det

    - name: Download PP-OCRv5 mobile recognition model
      run: just download-mobile-rec

    - name: Export PP-OCRv5 mobile recognition model
      run: just export-mobile-rec

    - name: Validate PP-OCRv5 mobile recognition model
      run: just validate-mobile-rec

    - name: Download PP-OCRv5 server detection model
      run: just download-server-det

    - name: Export PP-OCRv5 server detection model
      run: just export-server-det

    - name: Validate PP-OCRv5 server detection model
      run: just validate-server-det

    - name: Download PP-OCRv5 server recognition model
      run: just download-server-rec

    - name: Export PP-OCRv5 server recognition model
      run: just export-server-rec

    - name: Validate PP-OCRv5 server recognition model
      run: just validate-server-rec

    - name: Show model info
      run: just info

    - name: Create model info
      run: |
        echo "# PP-OCRv5 ONNX Models" > MODEL_INFO.md
        echo "" >> MODEL_INFO.md
        echo "Exported on: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> MODEL_INFO.md
        echo "Export method: Official PaddleOCR pipeline" >> MODEL_INFO.md
        echo "" >> MODEL_INFO.md
        echo "## Models" >> MODEL_INFO.md
        echo "" >> MODEL_INFO.md

        for model in onnx_models/*.onnx; do
          name=$(basename "$model" .onnx)
          size=$(ls -lh "$model" | awk '{print $5}')
          echo "- **$name.onnx** ($size)" >> MODEL_INFO.md
        done

        echo "" >> MODEL_INFO.md
        echo "## Usage" >> MODEL_INFO.md
        echo "" >> MODEL_INFO.md
        echo "These models can be used with ONNX Runtime:" >> MODEL_INFO.md
        echo "" >> MODEL_INFO.md
        echo '```python' >> MODEL_INFO.md
        echo 'import onnxruntime as ort' >> MODEL_INFO.md
        echo 'import numpy as np' >> MODEL_INFO.md
        echo '' >> MODEL_INFO.md
        echo '# Load detection model' >> MODEL_INFO.md
        echo "session = ort.InferenceSession('PP-OCRv5_server_det.onnx')" >> MODEL_INFO.md
        echo 'result = session.run(None, {"x": input_image})' >> MODEL_INFO.md
        echo '```' >> MODEL_INFO.md

    - name: Upload models as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ppocrv5-onnx-models
        path: |
          onnx_models/*.onnx
          MODEL_INFO.md
        retention-days: 30

    - name: Create release (on tag)
      if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
        name: PP-OCRv5 ONNX Models ${{ github.event.inputs.release_tag || github.ref_name }}
        body_path: MODEL_INFO.md
        files: |
          onnx_models/PP-OCRv5_server_det.onnx
          onnx_models/PP-OCRv5_server_rec.onnx
          onnx_models/PP-OCRv5_mobile_det.onnx
          onnx_models/PP-OCRv5_mobile_rec.onnx
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up
      if: always()
      run: |
        # Keep ONNX models but clean intermediate files
        just clean || true